<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de perfiles GitHub - Actividad 3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
    }

    .perfil {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .perfil img {
      width: 96px;
      border-radius: 50%;
    }

    .error {
      color: crimson;
    }

    .oculto {
      display: none;
    }

    .controles {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    #lenguajes {
      list-style: none;
      padding: 0;
    }

    #lenguajes li {
      padding: 0.2rem 0;
      border-bottom: 1px solid #eee;
    }

    #btn-mas {
      display: block;
      margin: 1rem auto;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.85rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Buscador de perfiles GitHub</h1>

  <form id="form-buscar">
    <div class="controles">
      <input type="text" id="input-usuario" placeholder="Usuario" required>

      <label for="select-orden">Ordenar:</label>
      <select id="select-orden">
        <option value="updated" selected>Actualizados</option>
        <option value="created">Creados</option>
        <option value="full_name">Nombre (A-Z)</option>
      </select>

      <button type="submit" id="btn-buscar">Buscar</button>
    </div>
  </form>

  <p id="estado"></p>

  <section id="perfil" class="perfil oculto"></section>

  <h2 id="titulo-repos" class="oculto">Repositorios recientes</h2>
  <ul id="repos"></ul>

  <button type="button" id="btn-mas" class="oculto">Cargar más</button>

  <h3 id="titulo-lenguajes" class="oculto">Lenguajes más usados</h3>
  <ul id="lenguajes"></ul>

  <footer id="pie" class="oculto">
    Peticiones restantes a la API de GitHub: <span id="ratelimit">—</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
